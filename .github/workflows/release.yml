# Pushing a tag such as v0.2 builds a signed release APK and attaches it to a GitHub release
# of the same name. Signing needs four repository secrets:
#   KEYSTORE_BASE64     the keystore file, base64-encoded (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD   its store password
#   KEY_ALIAS           the alias of the key inside it
#   KEY_PASSWORD        that key's password
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          XPRA_KEYSTORE: ${{ runner.temp }}/release.jks
          XPRA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XPRA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XPRA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PversionName="${GITHUB_REF_NAME#v}"
          -PversionCode=${{ github.run_number }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="kotlin-xpra-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes
